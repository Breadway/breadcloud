[package]
name = "breadcloud-server"
version = "0.1.0"
edition = "2021"
description = "breadcloud WebDAV + CalDAV server binary"

[[bin]]
name = "breadcloud-server"
path = "src/main.rs"

[dependencies]
breadcloud-storage = { path = "../breadcloud-storage" }
breadcloud-webdav = { path = "../breadcloud-webdav" }
breadcloud-caldav = { path = "../breadcloud-caldav" }
breadcloud-carddav = { path = "../breadcloud-carddav" }
breadcloud-webui = { path = "../breadcloud-webui" }
breadcloud-notes = { path = "../breadcloud-notes" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }
base64 = "0.22"
tokio-util = { version = "0.7", features = ["io"] }
