name: check

# Fast-fail lint/test on short-lived work branches, and on `main` itself:
# a push to main should be linted/tested too, not merged unchecked.
on:
  push:
    branches: ['feature/**', 'fix/**', 'main']

# Superseded commits on the same ref do not need another runner slot. Keep
# checks for different refs independent so every branch can still be verified.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted]
    timeout-minutes: 30
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          rm -rf src && mkdir src
          timeout --foreground --signal=TERM --kill-after=10s 5m \
            git clone --branch "${GITHUB_REF_NAME}" --depth 1 \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" src

      - name: clippy
        run: cd src && bash ci/build.sh cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cd src && bash ci/build.sh cargo test --workspace --locked
